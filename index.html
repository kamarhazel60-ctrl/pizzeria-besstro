<!doctype html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0d">
  <title>إدارة Besstro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#0b0b0d;--panel:#111114;--panel2:#16161a;--line:#29292f;--text:#f4f4f5;--muted:#a1a1aa;--orange:#f97316;--orange2:#fb923c;--red:#ef4444;--green:#34d399;font-family:'Tajawal',Inter,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;background-image:radial-gradient(ellipse at 50% -15%,rgba(249,115,22,.18),transparent 52%)}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{width:min(1160px,100% - 32px);margin:auto}.topbar{border-bottom:1px solid #27272e;background:rgba(11,11,13,.88);backdrop-filter:blur(14px)}.toprow{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#dc2626,var(--orange),#f59e0b);display:grid;place-items:center;box-shadow:0 10px 30px -10px #f9731659;font-size:24px}.brand strong{font-size:20px;letter-spacing:.04em}.brand small{display:block;color:var(--muted);font-size:12px}.top-actions{display:flex;align-items:center;gap:10px}.user-label{font-size:13px;color:#d4d4d8}.main{padding:34px 0 64px}.eyebrow{color:var(--orange2);font-size:13px;font-weight:800;letter-spacing:.08em}.heading{margin:5px 0 8px;font-size:clamp(25px,4vw,36px);line-height:1.25}.sub{color:var(--muted);margin:0 0 26px;line-height:1.7}.card{background:linear-gradient(145deg,#16161a,#111114);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 12px 32px -8px #0009}.gate{max-width:560px;margin:9vh auto;text-align:center;padding:clamp(24px,6vw,42px)}.gate-icon{width:62px;height:62px;margin:0 auto 18px;border-radius:20px;background:#f973161a;border:1px solid #f973164d;display:grid;place-items:center;font-size:28px}.btn{border:1px solid transparent;border-radius:12px;padding:11px 17px;font-weight:700;transition:.18s;min-height:44px}.btn:focus-visible,.field:focus-visible,.tab:focus-visible{outline:3px solid #fb923c;outline-offset:2px}.primary{background:linear-gradient(110deg,var(--orange),#dc2626);color:#fff;box-shadow:0 8px 24px #f973162b}.primary:hover{filter:brightness(1.1)}.quiet{background:#1c1c21;border-color:#35353d;color:#eee}.quiet:hover{border-color:#f9731680}.danger{background:#351719;border-color:#713032;color:#fecaca}.hidden{display:none!important}.tabs{display:flex;gap:8px;overflow:auto;padding:5px;margin:0 0 18px;border-bottom:1px solid var(--line)}.tab{white-space:nowrap;border:0;border-bottom:2px solid transparent;background:transparent;padding:12px 17px;color:#a1a1aa;font-weight:700}.tab[aria-selected="true"]{color:#fb923c;border-bottom-color:var(--orange)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:17px}.section-head h2{font-size:21px;margin:0}.rows{display:grid;gap:11px}.row{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#0d0d10;border:1px solid #29292f;border-radius:15px;padding:14px}.row-main{display:flex;align-items:center;gap:12px;min-width:0}.thumb{width:54px;height:54px;border-radius:12px;object-fit:cover;background:#222;flex:none}.row-copy{min-width:0}.row-copy strong,.row-copy span{display:block;overflow-wrap:anywhere}.row-copy span{color:var(--muted);font-size:13px;margin-top:4px}.row-actions{display:flex;gap:8px;flex:none}.status{display:inline-flex!important;width:max-content;align-items:center;border:1px solid #34d39944;background:#34d39912;color:#6ee7b7!important;padding:3px 8px;border-radius:99px;font-size:11px!important}.status.off{color:#fca5a5!important;border-color:#ef444444;background:#ef444412}.empty{padding:38px 18px;text-align:center;color:var(--muted);border:1px dashed #38383f;border-radius:15px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field-wrap{min-width:0}.field-wrap.wide{grid-column:1/-1}.label{display:block;margin:0 0 6px;font-size:13px;font-weight:700;color:#e4e4e7}.field{width:100%;background:#0b0b0d;border:1px solid #34343b;border-radius:11px;padding:11px 12px;color:#fafafa;min-height:45px}.field::placeholder{color:#71717a}.field:focus{border-color:var(--orange);outline:none}.field.area{resize:vertical;min-height:92px}.checkbox{display:flex;align-items:center;gap:9px;min-height:43px;color:#e4e4e7}.checkbox input{width:18px;height:18px;accent-color:var(--orange)}.price-wrap{display:flex;align-items:center;gap:8px}.price-wrap .field{flex:1}.price-unit{color:var(--orange2);font-weight:800}.file-row{display:flex;gap:9px;flex-wrap:wrap}.file-row input[type=file]{max-width:100%;color:#a1a1aa}.form-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.service-list{display:grid;gap:8px}.service-row{display:flex;gap:8px}.service-row .field{flex:1}.toast-wrap{position:fixed;inset-inline:12px;bottom:16px;z-index:10;display:flex;align-items:center;flex-direction:column;gap:8px;pointer-events:none}.toast{padding:12px 18px;border-radius:13px;background:#202024;border:1px solid #3f3f46;box-shadow:0 8px 30px #0009;max-width:520px;width:max-content;pointer-events:auto}.toast.error{border-color:#ef444477}.toast.success{border-color:#34d39977}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.loading{color:var(--muted);text-align:center;padding:36px}.hint{color:var(--muted);font-size:12px;margin-top:6px}@media(max-width:680px){.shell{width:min(100% - 22px,1160px)}.toprow{min-height:68px}.user-label{display:none}.main{padding-top:24px}.card{padding:16px;border-radius:18px}.form-grid{grid-template-columns:1fr}.field-wrap.wide{grid-column:auto}.section-head{align-items:flex-start}.row{align-items:flex-start;flex-direction:column}.row-main{width:100%}.row-actions{width:100%}.row-actions .btn{flex:1}.heading{font-size:27px}}
  </style>
  <script src="/admin.js" defer></script>
</head>
<body>
  <header class="topbar"><div class="shell toprow"><div class="brand"><div class="logo" aria-hidden="true">🔥</div><div><strong>BESSTRO</strong><small>لوحة إدارة المطعم</small></div></div><div class="top-actions"><span id="user-label" class="user-label"></span><button id="logout-btn" class="btn quiet hidden" type="button">تسجيل الخروج</button></div></div></header>
  <main class="shell main">
    <section id="gate" class="card gate" aria-live="polite"><div class="gate-icon" aria-hidden="true">✦</div><p class="eyebrow">BESSTRO • الإدارة</p><h1 id="gate-title" class="heading">جارٍ التحقق من الجلسة</h1><p id="gate-message" class="sub">يرجى الانتظار…</p><button id="login-btn" class="btn primary hidden" type="button">الدخول عبر حساب Manus</button><button id="retry-btn" class="btn quiet hidden" type="button">إعادة المحاولة</button></section>
    <section id="workspace" class="hidden" aria-label="إدارة محتوى المطعم"><p class="eyebrow">لوحة التحكم</p><h1 class="heading">إدارة محتوى المطعم</h1><p class="sub">تحديث القائمة والعروض ومعلومات الموقع من مكان واحد.</p><nav class="tabs" role="tablist" aria-label="أقسام لوحة الإدارة"><button class="tab" id="tab-menu" role="tab" aria-selected="true" aria-controls="panel-menu" type="button" data-tab="menu">قائمة الطعام</button><button class="tab" id="tab-offers" role="tab" aria-selected="false" aria-controls="panel-offers" type="button" data-tab="offers">العروض</button><button class="tab" id="tab-settings" role="tab" aria-selected="false" aria-controls="panel-settings" type="button" data-tab="settings">إعدادات الموقع</button></nav>
      <section id="panel-menu" class="card" role="tabpanel" aria-labelledby="tab-menu"><div class="section-head"><h2>أصناف القائمة</h2><button id="add-menu" class="btn primary" type="button">＋ إضافة صنف</button></div><div id="menu-rows" class="rows" aria-live="polite"></div></section>
      <section id="panel-offers" class="card hidden" role="tabpanel" aria-labelledby="tab-offers"><div class="section-head"><h2>العروض</h2><button id="add-offer" class="btn primary" type="button">＋ إضافة عرض</button></div><div id="offer-rows" class="rows" aria-live="polite"></div></section>
      <section id="panel-settings" class="card hidden" role="tabpanel" aria-labelledby="tab-settings"><div class="section-head"><h2>معلومات الموقع والتواصل</h2></div><form id="settings-form"><div id="settings-fields" class="form-grid"></div><div class="form-actions"><button class="btn primary" type="submit">حفظ الإعدادات</button></div></form></section>
      <section id="editor" class="card hidden" aria-labelledby="editor-title" style="margin-top:18px"><div class="section-head"><h2 id="editor-title">تحرير</h2><button id="close-editor" class="btn quiet" type="button" aria-label="إغلاق النموذج">إغلاق</button></div><form id="item-form"><div id="item-fields" class="form-grid"></div><div class="form-actions"><button id="save-item" class="btn primary" type="submit">حفظ</button><button id="delete-item" class="btn danger hidden" type="button">حذف</button><button id="cancel-item" class="btn quiet" type="button">إلغاء</button></div></form></section>
    </section>
  </main><div id="toasts" class="toast-wrap" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
