<script>
    // ضعي رابط الـ CSV الذي نسختيه من Google Sheets هنا بين علامتي التنصيص:
    const SHEET_CSV_URL = "ضعي_رابط_الجدول_هنا";
    const WHATSAPP_PHONE = "213000000000"; // رقم هاتف العميل

    let menuItems = [];
    let cart = [];

    const menuGrid = document.getElementById('menuGrid');
    const cartCount = document.getElementById('cartCount');
    const cartDrawer = document.getElementById('cartDrawer');
    const cartOverlay = document.getElementById('cartOverlay');
    const cartToggleBtn = document.getElementById('cartToggleBtn');
    const closeCartBtn = document.getElementById('closeCartBtn');
    const cartItemsContainer = document.getElementById('cartItemsContainer');
    const cartTotalPrice = document.getElementById('cartTotalPrice');
    const sendWhatsAppBtn = document.getElementById('sendWhatsAppBtn');
    const searchInput = document.getElementById('searchInput');
    const categoryFilters = document.getElementById('categoryFilters');

    // دالة جلب البيانات من Google Sheets
    async function loadMenuFromSheet() {
        menuGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">Chargement du menu...</p>';
        try {
            const response = await fetch(SHEET_CSV_URL);
            const csvText = await response.text();
            menuItems = parseCSV(csvText);
            renderMenu(menuItems);
        } catch (error) {
            menuGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #ff6b00;">Erreur de chargement du menu.</p>';
        }
    }

    // تحويل نص CSV إلى قائمة أطباق يفهمها الموقع
    function parseCSV(text) {
        const lines = text.trim().split('\n');
        const items = [];
        for (let i = 1; i < lines.length; i++) {
            // تقسيم الأعمدة مع مراعاة الفواصل داخل الوصف
            const cols = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"|"$/g, '').trim());
            if (cols.length >= 3 && cols[0]) {
                items.push({
                    id: i,
                    name: cols[0],
                    category: (cols[1] || 'pizza').toLowerCase(),
                    price: parseFloat(cols[2]) || 0,
                    desc: cols[3] || '',
                    badge: cols[4] || 'Spécialité',
                    img: cols[5] || 'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500'
                });
            }
        }
        return items;
    }

    function renderMenu(items) {
        menuGrid.innerHTML = '';
        if (items.length === 0) {
            menuGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">Aucun plat trouvé.</p>';
            return;
        }
        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'menu-card';
            card.innerHTML = `
                <div class="card-img-container">
                    <img src="${item.img}" alt="${item.name}" loading="lazy">
                    <span class="card-badge">${item.badge}</span>
                    <span class="card-price">${item.price} DA</span>
                </div>
                <div class="card-content">
                    <h3 class="card-title">${item.name}</h3>
                    <p class="card-desc">${item.desc}</p>
                    <button class="add-to-cart-btn" onclick="addToCart(${item.id})">+ Ajouter à la commande</button>
                </div>
            `;
            menuGrid.appendChild(card);
        });
    }

    function addToCart(id) {
        const product = menuItems.find(i => i.id === id);
        const existing = cart.find(i => i.id === id);
        if (existing) { existing.qty++; } else { cart.push({ ...product, qty: 1 }); }
        updateCartUI();
        openCart();
    }

    function updateCartUI() {
        const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
        cartCount.textContent = totalQty;
        if (cart.length === 0) {
            cartItemsContainer.innerHTML = '<p class="empty-cart-text">Votre panier est vide.</p>';
            cartTotalPrice.textContent = '0 DA';
            return;
        }
        cartItemsContainer.innerHTML = '';
        let totalPrice = 0;
        cart.forEach(item => {
            totalPrice += item.price * item.qty;
            const div = document.createElement('div');
            div.className = 'cart-item';
            div.innerHTML = `
                <div class="cart-item-info"><h4>${item.name}</h4><p>${item.price * item.qty} DA</p></div>
                <div class="cart-item-controls">
                    <button onclick="changeQty(${item.id}, -1)">-</button>
                    <span>${item.qty}</span>
                    <button onclick="changeQty(${item.id}, 1)">+</button>
                </div>
            `;
            cartItemsContainer.appendChild(div);
        });
        cartTotalPrice.textContent = totalPrice + ' DA';
    }

    function changeQty(id, delta) {
        const item = cart.find(i => i.id === id);
        if (item) {
            item.qty += delta;
            if (item.qty <= 0) { cart = cart.filter(i => i.id !== id); }
        }
        updateCartUI();
    }

    function openCart() { cartDrawer.classList.add('open'); cartOverlay.classList.add('open'); }
    function closeCart() { cartDrawer.classList.remove('open'); cartOverlay.classList.remove('open'); }

    cartToggleBtn.addEventListener('click', openCart);
    closeCartBtn.addEventListener('click', closeCart);
    cartOverlay.addEventListener('click', closeCart);

    searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        renderMenu(menuItems.filter(i => i.name.toLowerCase().includes(query) || i.desc.toLowerCase().includes(query)));
    });

    categoryFilters.addEventListener('click', (e) => {
        if (e.target.tagName === 'BUTTON') {
            document.querySelectorAll('.cat-pill').forEach(btn => btn.classList.remove('active'));
            e.target.classList.add('active');
            const filter = e.target.getAttribute('data-filter');
            renderMenu(filter === 'all' ? menuItems : menuItems.filter(i => i.category === filter));
        }
    });

    sendWhatsAppBtn.addEventListener('click', () => {
        if (cart.length === 0) return;
        const orderType = document.querySelector('input[name="orderType"]:checked').value;
        let message = `🛒 *Nouvelle Commande - BESSTRO*\n*Type:* ${orderType}\n\n`;
        let total = 0;
        cart.forEach(item => {
            message += `• ${item.name} x${item.qty} (${item.price * item.qty} DA)\n`;
            total += item.price * item.qty;
        });
        message += `\n*Total Général:* ${total} DA`;
        window.open(`https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(message)}`, '_blank');
    });

    // تشغيل جلب القائمة عند فتح الموقع
    loadMenuFromSheet();
</script>
